{% extends "base.html" %}

{% block content %}
<div class="portal-card-wrapper mb-4">
    <h1>Canales de <strong>Contacto</strong></h1>
    <p class="portal-subtitle">Información de contacto oficial para consultas y atención al usuario.</p>

    <div class="row">
        <!-- Correo Electrónico -->
        <div class="col-12 col-md-4 mb-3 mb-md-0">
            <div class="service-card info-card h-100">
                <span class="badge badge-dark-accent mb-3">Correo Electrónico</span>
                <h5 class="service-title mb-2">Soporte General</h5>
                <p class="info-card-text">StarRock@portalservicios.mx</p>
            </div>
        </div>

        <!-- Teléfono -->
        <div class="col-12 col-md-4 mb-3 mb-md-0">
            <div class="service-card info-card h-100">
                <span class="badge badge-dark-accent mb-3">Teléfono</span>
                <h5 class="service-title mb-2">Línea Directa</h5>
                <p class="info-card-text">+52 (477) 555-0194</p>
            </div>
        </div>

        <!-- Instagram -->
        <div class="col-12 col-md-4">
            <div class="service-card info-card h-100">
                <span class="badge badge-dark-accent mb-3">Instagram</span>
                <h5 class="service-title mb-2">Red Social</h5>
                <p class="info-card-text">@StarRock.mx</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
